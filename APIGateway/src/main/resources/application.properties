spring.cloud.gateway.mvc.routes[0].id=user-service
spring.cloud.gateway.mvc.routes[0].uri=lb://USERSERVICE
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/users/**
spring.cloud.gateway.mvc.routes[0].filters[0]=StripPrefix=3

spring.cloud.gateway.mvc.routes[1].id=posts-service
spring.cloud.gateway.mvc.routes[1].uri=lb://POSTSSERVICE
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/posts/**
spring.cloud.gateway.mvc.routes[1].filters[0]=StripPrefix=2

spring.cloud.gateway.mvc.routes[2].id=connections-service
spring.cloud.gateway.mvc.routes[2].uri=lb://CONNECTIONSSERVICE
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/connections/**
spring.cloud.gateway.mvc.routes[2].filters[0]=StripPrefix=2