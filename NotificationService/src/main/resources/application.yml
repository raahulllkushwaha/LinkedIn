spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ${spring.application.name}
      # 1. Use ErrorHandlingDeserializer to catch the infinite loop errors
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # 2. Delegate the actual deserialization to your intended classes
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.LongDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        # 3. Trust all packages
        spring.json.trusted.packages: "*"

        # 4. Map the Producer's exact class paths to the Consumer's class paths
        spring.json.type.mapping: "com.rahul.postservice.event.PostCreated:com.rahul.notificationservice.event.PostCreated,com.rahul.postservice.event.PostLiked:com.rahul.notificationservice.event.PostLiked"